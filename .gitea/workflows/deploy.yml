name: Deploy

# Gitea Actions, deploying to the machine the runner is on. Tests, builds and
# brings the stack up locally with docker compose — no registry, no SSH.
#
# This file is specific to one instance and nothing else depends on it. To use
# it, point `runs-on:` at your own self-hosted runner's label; to deploy some
# other way, delete it. GitHub and GitLab ignore `.gitea/` entirely.
#
# Deploy layout on the target host:
#   ~/webcalc/docker-compose.prod.yml   copied here by this workflow
#   ~/webcalc/.env                      optional, sets TZ and SPACES
#   volume webcalc_webcalc-data         the sheets database; never renamed
#
# The compose project name is pinned with `-p webcalc` so the volume keeps its
# existing name. Changing the project name or the volume key would silently
# start the app on an empty database.

on:
  push:
    branches: [main]
    # Docs-only changes don't need a rebuild/redeploy. README.md is not one of
    # them: `engine/test/readme.test.ts` runs its example tables against the
    # engine, so editing it can fail the suite and has to be tested like code.
    paths-ignore:
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

# Two pushes landing within a run of each other would otherwise put two
# deploys on the host at once, both running `compose up -d` against the same
# container and the same sheets volume. `cancel-in-progress: false` protects
# the deploy that is already running rather than interrupting it part-way.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    # The label of the self-hosted runner on the machine being deployed to.
    # Replace with your own.
    runs-on: shuri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        # The `test` stage runs the engine and server suites inside the image,
        # so this needs no Node on the host. A failure here stops the deploy.
        #
        # --network=host: build RUN steps use the host's resolver. The default
        # container DNS drops npm's burst of tarball fetches (EAI_AGAIN).
        run: docker build --network=host --target test -t webcalc:test .

      - name: Build image
        # Reuses the layers the test stage just built, so this is nearly free.
        run: docker build --network=host -t webcalc:latest .

      - name: Deploy
        run: |
          DIR="$HOME/webcalc"
          mkdir -p "$DIR"
          cp docker-compose.prod.yml "$DIR/"
          cd "$DIR"
          docker compose -p webcalc -f docker-compose.prod.yml up -d
          docker image prune -f

      - name: Wait for the app to serve
        # A container that starts is not the same as an app that serves. Fail
        # the run loudly, with logs, rather than reporting a broken deploy green.
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8422/api/health; then
              echo
              echo "WebCalc is serving after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "WebCalc did not become healthy within 60s."
          docker logs --tail 50 webcalc || true
          exit 1

      - name: Smoke test the engine
        # `/api/health` is equally true of a container serving a broken engine:
        # it reports that the process is up and which date its rates carry, and
        # nothing at all about whether a sheet would answer. This asks the
        # deployed engine an actual question and checks the actual answer.
        #
        # The password, when the instance has one, lives in the same ~/webcalc/.env
        # the compose file reads — on this host, since this runner is on it.
        # Without signing in the request would 401 and this would test the guard
        # rather than the engine.
        #
        # No `jq`: this step is the last gate on every deploy, so it depends on
        # nothing the runner might not have. The response shape is fixed and
        # this file is the only reader of it.
        run: |
          set -e
          BASE=http://127.0.0.1:8422
          JAR=$(mktemp)
          trap 'rm -f "$JAR"' EXIT

          ENV_FILE="$HOME/webcalc/.env"
          PASSWORD=""
          if [ -f "$ENV_FILE" ]; then
            PASSWORD=$(sed -n 's/^WEBCALC_PASSWORD=//p' "$ENV_FILE" | sed -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'$/\1/")
          fi
          if [ -n "$PASSWORD" ]; then
            ESCAPED=$(printf '%s' "$PASSWORD" | sed -e 's/\\/\\\\/g' -e 's/"/\\"/g')
            curl -fsS -c "$JAR" -X POST "$BASE/api/session" \
              -H 'content-type: application/json' \
              -d "{\"password\":\"$ESCAPED\"}" > /dev/null
          fi

          # Currency exercises the rate table as well as the arithmetic, and a
          # unit conversion reaches parts of the engine a plain sum does not.
          BODY='{"input":["2 + 2 * 10","10 km in miles","100 USD in EUR"]}'
          # Captured whole first, so a 401 or a 500 is reported as itself rather
          # than as an empty answer to the arithmetic.
          if ! RESPONSE=$(curl -fsS -b "$JAR" -X POST "$BASE/api/evaluate" \
            -H 'content-type: application/json' -d "$BODY"); then
            echo "The deployed instance would not answer /api/evaluate."
            echo "If it has a password, check WEBCALC_PASSWORD in $ENV_FILE."
            docker logs --tail 50 webcalc || true
            exit 1
          fi

          ANSWERS=$(printf '%s' "$RESPONSE" | grep -o '"output":"[^"]*"' | sed 's/"output":"//;s/"$//')
          echo "$ANSWERS"
          FIRST=$(echo "$ANSWERS" | sed -n 1p)
          if [ "$FIRST" != "22" ]; then
            echo "The deployed engine answered '$FIRST' rather than 22."
            docker logs --tail 50 webcalc || true
            exit 1
          fi
          # The other two depend on the live rates and on the instance's region,
          # so what is checked is that they were answered at all.
          if [ "$(echo "$ANSWERS" | sed -n '2p;3p' | grep -c .)" != "2" ]; then
            echo "The deployed engine left a conversion unanswered."
            docker logs --tail 50 webcalc || true
            exit 1
          fi
          echo "The deployed engine computes."
