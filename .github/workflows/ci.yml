name: CI

# The verdict on a change. It does not deploy anything: the instance this was
# built for is updated by hand on its host, so there is no pipeline here to hand
# off to. This says whether the code is good; a person decides when it ships.
#
# Which makes this the only automatic gate there is. Nothing stops a red commit
# reaching the host except somebody reading the result of this run.
#
# The suites also run inside the image when the image is built. This runs them
# on the host instead, because a pull request wants a readable failure more than
# it wants a faithful runtime.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push or a quick second commit should not leave two runs racing on the
# same ref. The older one is abandoned — unlike the deploy, where cancelling a
# run midway would leave a half-updated host.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes anywhere. Stated rather than assumed, so a workflow added
# later has to ask for what it needs.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 22, not `latest`: the server stores sheets through the built-in
          # `node:sqlite` module, which is behind --experimental-sqlite on 22 and
          # is what the image ships. Testing on a newer Node would be testing
          # something nobody runs.
          node-version: '22'
          cache: npm

      # `ci`, not `install`: the lockfile decides, and a lockfile that has
      # drifted from package.json should fail the run rather than be quietly
      # rewritten.
      - run: npm ci

      # Correctness rules only; formatting is the check below. Warnings do not
      # fail the run — see eslint.config.js for the two rules staged that way.
      - run: npm run lint

      # `--check`, not `--write`: CI reports, a person formats. A job that
      # rewrote the tree would either have to push its own commit, or would
      # pass while leaving main unformatted.
      - run: npm run format:check

      - run: npm test

      - run: npm run typecheck

      # Last, and not redundant: `npm test` builds the engine through its
      # pretest hook but never builds the web bundle, so a broken import in the
      # UI would otherwise reach main with every check green.
      - run: npm run build
