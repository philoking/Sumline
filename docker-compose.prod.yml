# Deployment compose file.
#
# Unlike docker-compose.yml this has no `build:` stanza — the image is built
# separately and this file only runs it. So `up --build` does nothing here;
# `docker build -t sumline:latest .` has to happen first.

# The project name decides the volume's real name. Pinned here rather than
# passed as `-p sumline` on the command line, because forgetting the flag would
# start the app on an empty database rather than failing.
name: sumline

services:
  sumline:
    image: sumline:latest
    container_name: sumline
    restart: unless-stopped
    ports:
      - '8422:8080'
    environment:
      # Date maths resolves in this zone. Overridable from ~/sumline/.env.
      TZ: ${TZ:-America/Los_Angeles}
      # One shared password for the whole instance, set in ~/sumline/.env so it
      # never reaches the repository. Empty means no authentication.
      SUMLINE_PASSWORD: ${SUMLINE_PASSWORD:-}
    volumes:
      - sumline-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Resolves to sumline_sumline-data under the project name above. Renaming
  # either would orphan the sheets, so both stay fixed from here on.
  sumline-data:
