# Deployment compose file, used by .gitea/workflows/deploy.yml.
#
# Unlike docker-compose.yml this has no `build:` stanza — the runner builds the
# image and this file only runs it, so the deploy directory holds no source.
services:
  sumline:
    image: sumline:latest
    container_name: sumline
    restart: unless-stopped
    ports:
      - "8422:8080"
    environment:
      # Date maths resolves in this zone. Overridable from ~/sumline/.env.
      TZ: ${TZ:-America/Los_Angeles}
      # One shared password for the whole instance, set in ~/sumline/.env so it
      # never reaches the repository. Empty means no authentication.
      SUMLINE_PASSWORD: ${SUMLINE_PASSWORD:-}
    volumes:
      - sumline-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Resolves to sumline_sumline-data under `-p sumline`. Renaming either would
  # orphan the sheets, so both stay fixed from here on.
  sumline-data:
