services:
  webcalc:
    build: .
    image: webcalc:latest
    container_name: webcalc
    restart: unless-stopped
    ports:
      # host:container — change the host port if 8422 is taken on your box
      - "8422:8080"
    environment:
      # Date maths ("today + 3 weeks", "days until…") resolves in this zone,
      # so set it to wherever you actually are.
      TZ: ${TZ:-UTC}
      # One shared password for the whole instance. Empty means no
      # authentication, which is the default.
      WEBCALC_PASSWORD: ${WEBCALC_PASSWORD:-}
    volumes:
      - webcalc-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  webcalc-data:
