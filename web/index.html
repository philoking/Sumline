<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Sumline</title>
    <!--
      The mark: a heavy italic S reversed out of a red tile, after the Redline
      BMX wordmark this app's logo is a homage to. The speed bars belong to the
      full wordmark, which has room for them; this does not.

      Drawn as an inline SVG so the app ships no image file, and drawn twice —
      here and as `Mark` in src/Wordmark.tsx — because this link is static HTML
      and cannot import a module. Change one and change the other.
    -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e4002b'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-size='24' font-weight='900' font-style='italic' font-family='system-ui,sans-serif' fill='%23fff'%3ES%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
